version: '3.8'

services:
  backend:
    build:
      context: ./Edusaz.Backend
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Provide SQL Server connection string here for production if needed
      # - ConnectionStrings__DefaultConnection=Server=db,1433;Database=EdusazDb;User=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true;
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data:
