<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <!-- Language & Translation -->
    <meta name="google" content="notranslate" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/edusaz.svg" />
    <link rel="alternate icon" type="image/png" href="/edusaz-yan.png" />

    <!-- Viewport -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Primary SEO -->
    <title>Edusaz — AI-Powered Global Education Platform</title>

    <meta
        name="description"
        content="Edusaz is an AI-powered global education platform for discovering universities, courses, scholarships, skills and international study opportunities."
    />

    <meta
        name="keywords"
        content="Edusaz, global education, AI education, universities, scholarships, courses, study abroad, online courses, university search, education platform, Azerbaijan education"
    />

    <meta name="author" content="Edusaz" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Canonical -->
    <link rel="canonical" href="https://edusaz.com/" />

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Edusaz" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Edusaz" />
    <meta property="og:title" content="Edusaz — AI-Powered Global Education Platform" />
    <meta
        property="og:description"
        content="Discover universities, courses, scholarships and global learning opportunities with Edusaz."
    />
    <meta property="og:url" content="https://edusaz.com/" />
    <meta property="og:image" content="https://edusaz.com/edusaz-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Edusaz — Global Education & AI Platform" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Edusaz — AI-Powered Global Education Platform" />
    <meta
        name="twitter:description"
        content="Discover universities, courses, scholarships and global learning opportunities with Edusaz."
    />
    <meta name="twitter:image" content="https://edusaz.com/edusaz-og.png" />
    <meta name="twitter:image:alt" content="Edusaz — Global Education & AI Platform" />

    <!-- Language Alternatives -->
    <link rel="alternate" hreflang="en" href="https://edusaz.com/" />
    <link rel="alternate" hreflang="az" href="https://edusaz.com/az" />
    <link rel="alternate" hreflang="x-default" href="https://edusaz.com/" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Edusaz",
        "url": "https://edusaz.com/",
        "logo": "https://edusaz.com/edusaz.svg",
        "description": "AI-powered global education platform for discovering universities, courses, scholarships and learning opportunities.",
        "sameAs": []
    }
    </script>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Edusaz",
        "url": "https://edusaz.com/",
        "potentialAction": {
            "@type": "SearchAction",
            "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://edusaz.com/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
        }
    }
    </script>
</head>

<body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
