name: Deploy Frontend & Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- 1. FRONTEND BUILD & DEPLOY ---
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build React frontend
        run: npm run build

      - name: Copy Frontend files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/**"
          target: "/var/www/edusaz"
          strip_components: 1

      # --- 2. BACKEND BUILD & DEPLOY ---
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish .NET Backend
        run: dotnet publish Edusaz.Backend/Edusaz.API/Edusaz.API.csproj -c Release -o ./publish_backend

      - name: Stop Backend Service on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            systemctl stop edusaz-backend || systemctl stop edusaz || systemctl stop edusaz-api || true

      - name: Copy Backend files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "publish_backend/**"
          target: "/var/www/edusaz-backend"
          strip_components: 1

      # --- 3. START SERVICES ON VPS & APPLY DB PERMISSIONS ---
      - name: Start Backend & Reverse Proxy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # 1. Execute DB migrations & table ownership as postgres superuser (Host & Docker)
            export PGPASSWORD=postgres
            psql -h 127.0.0.1 -U postgres -c 'ALTER USER postgres WITH SUPERUSER;' || sudo -u postgres psql -c 'ALTER USER postgres WITH SUPERUSER;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" OWNER TO postgres;' || sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" OWNER TO postgres;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetRoles" OWNER TO postgres;' || sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetRoles" OWNER TO postgres;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUserRoles" OWNER TO postgres;' || sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUserRoles" OWNER TO postgres;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO postgres;' || sudo -u postgres psql -d edusaz_db -c 'GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO postgres;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "UniversityId" uuid;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "ProfileImageUrl" text;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "Country" text;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "DegreeLevel" text;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "DesiredField" text;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "EnglishScore" text;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "Gpa" double precision;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "StudentApplications" ADD COLUMN IF NOT EXISTS "CourseId" uuid;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c 'DROP TABLE IF EXISTS "CoursePayments" CASCADE;' || sudo -u postgres psql -d edusaz_db -c 'DROP TABLE IF EXISTS "CoursePayments" CASCADE;' || true
            psql -h 127.0.0.1 -U postgres -d edusaz_db -c '
              CREATE TABLE IF NOT EXISTS "CoursePayments" (
                "Id" uuid NOT NULL PRIMARY KEY,
                "CourseId" uuid NOT NULL,
                "UserEmail" text NOT NULL,
                "StudentName" text,
                "EpointOrderId" text NOT NULL,
                "TransactionId" text,
                "Amount" numeric NOT NULL,
                "Currency" text NOT NULL,
                "Status" text NOT NULL,
                "RefundStatus" text,
                "RefundRequestedAt" timestamp with time zone,
                "RefundedAt" timestamp with time zone,
                "RefundNote" text,
                "PaidAt" timestamp with time zone,
                "CreatedDate" timestamp with time zone NOT NULL,
                "LastUpdatedDate" timestamp with time zone NOT NULL,
                "DeletedDate" timestamp with time zone,
                "IsDeleted" boolean NOT NULL DEFAULT false
              );
              ALTER TABLE "CoursePayments" OWNER TO postgres;
              GRANT ALL PRIVILEGES ON TABLE "CoursePayments" TO postgres;
              GRANT ALL PRIVILEGES ON TABLE "CoursePayments" TO PUBLIC;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO postgres;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO PUBLIC;
            ' || sudo -u postgres psql -d edusaz_db -c '
              CREATE TABLE IF NOT EXISTS "CoursePayments" (
                "Id" uuid NOT NULL PRIMARY KEY,
                "CourseId" uuid NOT NULL,
                "UserEmail" text NOT NULL,
                "StudentName" text,
                "EpointOrderId" text NOT NULL,
                "TransactionId" text,
                "Amount" numeric NOT NULL,
                "Currency" text NOT NULL,
                "Status" text NOT NULL,
                "RefundStatus" text,
                "RefundRequestedAt" timestamp with time zone,
                "RefundedAt" timestamp with time zone,
                "RefundNote" text,
                "PaidAt" timestamp with time zone,
                "CreatedDate" timestamp with time zone NOT NULL,
                "LastUpdatedDate" timestamp with time zone NOT NULL,
                "DeletedDate" timestamp with time zone,
                "IsDeleted" boolean NOT NULL DEFAULT false
              );
              ALTER TABLE "CoursePayments" OWNER TO postgres;
              GRANT ALL PRIVILEGES ON TABLE "CoursePayments" TO postgres;
              GRANT ALL PRIVILEGES ON TABLE "CoursePayments" TO PUBLIC;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO postgres;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO PUBLIC;
            ' || true

            psql -h 127.0.0.1 -U postgres -d edusaz_db -c "
              DO \$\$ DECLARE r RECORD;
              BEGIN
                EXECUTE 'GRANT ALL ON SCHEMA public TO postgres;';
                EXECUTE 'GRANT ALL ON SCHEMA public TO PUBLIC;';
                FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP
                  EXECUTE 'ALTER TABLE public.' || quote_ident(r.tablename) || ' OWNER TO postgres;';
                  EXECUTE 'GRANT ALL ON TABLE public.' || quote_ident(r.tablename) || ' TO postgres;';
                  EXECUTE 'GRANT ALL ON TABLE public.' || quote_ident(r.tablename) || ' TO PUBLIC;';
                END LOOP;
              END \$\$;
            " || sudo -u postgres psql -d edusaz_db -c "
              DO \$\$ DECLARE r RECORD;
              BEGIN
                EXECUTE 'GRANT ALL ON SCHEMA public TO postgres;';
                EXECUTE 'GRANT ALL ON SCHEMA public TO PUBLIC;';
                FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP
                  EXECUTE 'ALTER TABLE public.' || quote_ident(r.tablename) || ' OWNER TO postgres;';
                  EXECUTE 'GRANT ALL ON TABLE public.' || quote_ident(r.tablename) || ' TO postgres;';
                  EXECUTE 'GRANT ALL ON TABLE public.' || quote_ident(r.tablename) || ' TO PUBLIC;';
                END LOOP;
              END \$\$;
            " || true

            sudo -u postgres psql -d edusaz_db -c "
              UPDATE \"AspNetUsers\" SET \"UniversityId\" = NULL 
              WHERE \"Id\" NOT IN (
                SELECT ur.\"UserId\" FROM \"AspNetUserRoles\" ur 
                JOIN \"AspNetRoles\" r ON ur.\"RoleId\" = r.\"Id\" 
                WHERE r.\"Name\" = 'UniversityAdmin'
              );
            " || true

            # If PostgreSQL runs inside a docker container on VPS:
            if command -v docker &> /dev/null; then
              for container in $(docker ps -q); do
                docker exec $container psql -U postgres -c 'ALTER USER postgres WITH SUPERUSER;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" OWNER TO postgres;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'GRANT ALL ON ALL TABLES IN SCHEMA public TO postgres;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "UniversityId" uuid;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "ProfileImageUrl" text;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "Country" text;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "DegreeLevel" text;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "DesiredField" text;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "EnglishScore" text;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "Gpa" double precision;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "StudentApplications" ADD COLUMN IF NOT EXISTS "CourseId" uuid;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c '
                  CREATE TABLE IF NOT EXISTS "CoursePayments" (
                    "Id" uuid NOT NULL PRIMARY KEY,
                    "CourseId" uuid NOT NULL,
                    "UserEmail" text NOT NULL,
                    "StudentName" text,
                    "EpointOrderId" text NOT NULL,
                    "TransactionId" text,
                    "Amount" numeric NOT NULL,
                    "Currency" text NOT NULL,
                    "Status" text NOT NULL,
                    "RefundStatus" text,
                    "RefundRequestedAt" timestamp with time zone,
                    "RefundedAt" timestamp with time zone,
                    "RefundNote" text,
                    "PaidAt" timestamp with time zone,
                    "CreatedDate" timestamp with time zone NOT NULL,
                    "LastUpdatedDate" timestamp with time zone NOT NULL,
                    "DeletedDate" timestamp with time zone,
                    "IsDeleted" boolean NOT NULL DEFAULT false
                  );
                  ALTER TABLE "CoursePayments" ADD COLUMN IF NOT EXISTS "DeletedDate" timestamp with time zone;
                  ALTER TABLE "CoursePayments" ADD COLUMN IF NOT EXISTS "RefundStatus" text NOT NULL DEFAULT 'None';
                  ALTER TABLE "CoursePayments" ADD COLUMN IF NOT EXISTS "RefundRequestedAt" timestamp with time zone;
                  ALTER TABLE "CoursePayments" ADD COLUMN IF NOT EXISTS "RefundedAt" timestamp with time zone;
                  ALTER TABLE "CoursePayments" ADD COLUMN IF NOT EXISTS "RefundNote" text;
                  ALTER TABLE "CoursePayments" ADD COLUMN IF NOT EXISTS "PaidAt" timestamp with time zone;
                  ALTER TABLE "CoursePayments" ADD COLUMN IF NOT EXISTS "TransactionId" text NOT NULL DEFAULT '';
                  ALTER TABLE "CoursePayments" OWNER TO postgres;
                  GRANT ALL PRIVILEGES ON TABLE "CoursePayments" TO postgres;
                  GRANT ALL PRIVILEGES ON TABLE "CoursePayments" TO PUBLIC;
                  GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO postgres;
                  GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO PUBLIC;
                ' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c "
                  DO \$\$ DECLARE r RECORD;
                  BEGIN
                    EXECUTE 'GRANT ALL ON SCHEMA public TO postgres;';
                    EXECUTE 'GRANT ALL ON SCHEMA public TO PUBLIC;';
                    FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP
                      EXECUTE 'ALTER TABLE public.' || quote_ident(r.tablename) || ' OWNER TO postgres;';
                      EXECUTE 'GRANT ALL ON TABLE public.' || quote_ident(r.tablename) || ' TO postgres;';
                      EXECUTE 'GRANT ALL ON TABLE public.' || quote_ident(r.tablename) || ' TO PUBLIC;';
                    END LOOP;
                  END \$\$;
                " 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c "
                  UPDATE \"AspNetUsers\" SET \"UniversityId\" = NULL 
                  WHERE \"Id\" NOT IN (
                    SELECT ur.\"UserId\" FROM \"AspNetUserRoles\" ur 
                    JOIN \"AspNetRoles\" r ON ur.\"RoleId\" = r.\"Id\" 
                    WHERE r.\"Name\" = 'UniversityAdmin'
                  );
                " 2>/dev/null || true
              done
            fi

            # 3. Set permissions and start backend & reverse proxy
            chmod -R 755 /var/www/edusaz-backend || true
            systemctl daemon-reload
            systemctl start edusaz-backend || systemctl start edusaz || systemctl start edusaz-api || systemctl start kestrel-edusaz || true
            systemctl restart edusaz-backend || systemctl restart edusaz || systemctl restart edusaz-api || systemctl restart kestrel-edusaz || systemctl restart dotnet-edusaz || true
            systemctl reload caddy || systemctl restart caddy || systemctl reload nginx || systemctl restart nginx || true