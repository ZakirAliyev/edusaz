name: Deploy Frontend & Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- 1. FRONTEND BUILD & DEPLOY ---
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build React frontend
        run: npm run build

      - name: Copy Frontend files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/**"
          target: "/var/www/edusaz"
          strip_components: 1

      # --- 2. BACKEND BUILD & DEPLOY ---
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish .NET Backend
        run: dotnet publish Edusaz.Backend/Edusaz.API/Edusaz.API.csproj -c Release -o ./publish_backend

      - name: Stop Backend Service on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            systemctl stop edusaz-backend || systemctl stop edusaz || systemctl stop edusaz-api || true

      - name: Copy Backend files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "publish_backend/**"
          target: "/var/www/edusaz-backend"
          strip_components: 1

      # --- 3. START SERVICES ON VPS & APPLY DB PERMISSIONS ---
      - name: Start Backend & Reverse Proxy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # 1. Execute DB migrations & table ownership as postgres superuser (Host & Docker)
            sudo -u postgres psql -c 'ALTER USER postgres WITH SUPERUSER;' || true
            sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE "AspNetUsers" OWNER TO postgres;' || true
            sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE "AspNetRoles" OWNER TO postgres;' || true
            sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE "AspNetUserRoles" OWNER TO postgres;' || true
            sudo -u postgres psql -d edusaz_db -c 'GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO postgres;' || true
            sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "UniversityId" uuid;' || true
            sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "ProfileImageUrl" text;' || true
            sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "Country" text;' || true
            sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "DegreeLevel" text;' || true
            sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "DesiredField" text;' || true
            sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "EnglishScore" text;' || true
            sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "Gpa" double precision;' || true
            sudo -u postgres psql -d edusaz_db -c 'ALTER TABLE IF EXISTS "StudentApplications" ADD COLUMN IF NOT EXISTS "CourseId" uuid;' || true

            # 2. Clean all users except SuperAdmin
            sudo -u postgres psql -d edusaz_db -c "DELETE FROM \"AspNetUsers\" WHERE lower(trim(\"Email\")) NOT IN ('superadmin@edu.saz', 'superadmin@edusaz.com');" || true

            # If PostgreSQL runs inside a docker container on VPS:
            if command -v docker &> /dev/null; then
              for container in $(docker ps -q); do
                docker exec $container psql -U postgres -c 'ALTER USER postgres WITH SUPERUSER;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE "AspNetUsers" OWNER TO postgres;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'GRANT ALL ON ALL TABLES IN SCHEMA public TO postgres;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "UniversityId" uuid;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "ProfileImageUrl" text;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "Country" text;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "DegreeLevel" text;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "DesiredField" text;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "EnglishScore" text;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "AspNetUsers" ADD COLUMN IF NOT EXISTS "Gpa" double precision;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c 'ALTER TABLE IF EXISTS "StudentApplications" ADD COLUMN IF NOT EXISTS "CourseId" uuid;' 2>/dev/null || true
                docker exec $container psql -U postgres -d edusaz_db -c "DELETE FROM \"AspNetUsers\" WHERE lower(trim(\"Email\")) NOT IN ('superadmin@edu.saz', 'superadmin@edusaz.com');" 2>/dev/null || true
              done
            fi

            # 2. Restart backend and reverse proxy
            systemctl daemon-reload
            systemctl restart edusaz-backend || systemctl restart edusaz || systemctl restart edusaz-api || systemctl restart kestrel-edusaz || systemctl restart dotnet-edusaz || true
            systemctl reload caddy || systemctl restart caddy || systemctl reload nginx || systemctl restart nginx || true