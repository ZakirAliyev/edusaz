name: Deploy Frontend & Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- 1. FRONTEND BUILD & DEPLOY ---
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build React frontend
        run: npm run build

      - name: Copy Frontend files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/**"
          target: "/var/www/edusaz"
          strip_components: 1

      # --- 2. BACKEND BUILD & DEPLOY ---
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish .NET Backend
        run: dotnet publish Edusaz.Backend/Edusaz.API/Edusaz.API.csproj -c Release -o ./publish_backend

      - name: Stop Backend Service on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            systemctl stop edusaz-backend || systemctl stop edusaz || systemctl stop edusaz-api || true

      - name: Copy Backend files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "publish_backend/**"
          target: "/var/www/edusaz-backend"
          strip_components: 1

      # --- 3. START SERVICES ON VPS ---
      - name: Start Backend & Reverse Proxy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            systemctl daemon-reload
            systemctl restart edusaz-backend || systemctl restart edusaz || systemctl restart edusaz-api || systemctl restart kestrel-edusaz || systemctl restart dotnet-edusaz || true
            systemctl reload caddy || systemctl restart caddy || systemctl reload nginx || systemctl restart nginx || true