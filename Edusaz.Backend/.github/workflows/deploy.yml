name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish .NET Backend
        run: dotnet publish Edusaz.API/Edusaz.API.csproj -c Release -o ./publish_backend

      - name: Copy Backend files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "publish_backend/**"
          target: "/var/www/edusaz-backend"
          strip_components: 1

      - name: Restart Backend Service & Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            systemctl restart edusaz-backend || systemctl restart edusaz || systemctl restart edusaz-api || true
            systemctl reload nginx
